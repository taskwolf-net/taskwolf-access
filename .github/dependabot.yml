version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    groups:
      gradle:
        patterns: ["*"]
    ignore:
      # ponytail: 29+ switches the Stripe API version, payment code needs migrating first
      - dependency-name: com.stripe:stripe-java
        versions: [">=29"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
